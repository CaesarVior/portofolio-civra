<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /app/public

    <Directory />
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /app/public>
        Options -Indexes -Includes
        AllowOverride All
        Require all granted
    </Directory>

    <DirectoryMatch "^/app/(?!public(?:/|$))">
        Require all denied
    </DirectoryMatch>

    ServerTokens Prod
    ServerSignature Off
    TraceEnable Off

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
